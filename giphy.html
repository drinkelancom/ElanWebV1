<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<title>ÉLAN Giphy scenes</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&f[]=zodiak@700,800,900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet" />
<style>
  :root {
    --ivory:#fffaee; --forest:#0c2c1b; --deep:#123a24; --green:#51b83e;
    --green-dark:#3f9430; --clay:#c58a6d; --sand:#efe4d3; --ink:#14130f;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#222; }
  .stage {
    position:relative; width:480px; height:480px; overflow:hidden;
    font-family:'Cabinet Grotesk',sans-serif;
  }
  .script { font-family:'Sacramento',cursive; font-weight:400; }
  .serif { font-family:'Zodiak',serif; font-weight:800; }
  .logo { position:absolute; right:18px; bottom:16px; height:20px; z-index:50; }
  img { user-select:none; }

  /* ══ 1. float — stay hydrated ══ */
  .s-float { background:radial-gradient(120% 100% at 50% 0%, #1b5233, var(--forest)); }
  .s-float .glow { position:absolute; left:50%; top:55%; width:340px; height:420px; transform:translate(-50%,-50%);
    background:radial-gradient(ellipse, rgba(150,240,190,.35), transparent 65%); filter:blur(30px);
    animation:f-glow var(--dur) ease-in-out infinite; }
  @keyframes f-glow { 0%,100%{opacity:.7} 50%{opacity:1} }
  .s-float .pack { position:absolute; left:50%; top:54%; height:300px; transform:translate(-50%,-50%);
    filter:drop-shadow(0 24px 26px rgba(0,0,0,.5)); animation:f-bob var(--dur) ease-in-out infinite; }
  @keyframes f-bob { 0%,100%{transform:translate(-50%,-50%) rotate(-2deg)} 50%{transform:translate(-50%,-56%) rotate(2deg)} }
  .s-float .palm { position:absolute; width:190px; }
  .s-float .palm.a { top:-36px; left:-40px; transform:rotate(-140deg) scaleX(-1); animation:f-sway var(--dur) ease-in-out infinite; }
  .s-float .palm.b { bottom:-30px; right:-36px; transform:rotate(28deg); animation:f-sway2 var(--dur) ease-in-out infinite; }
  @keyframes f-sway  { 0%,100%{rotate:0deg} 50%{rotate:5deg} }
  @keyframes f-sway2 { 0%,100%{rotate:0deg} 50%{rotate:-5deg} }
  .s-float .txt { position:absolute; left:50%; top:44px; transform:translateX(-50%); color:var(--ivory);
    font-size:52px; white-space:nowrap; text-shadow:0 6px 18px rgba(0,0,0,.4);
    animation:f-txt var(--dur) ease-in-out infinite; }
  @keyframes f-txt { 0%,100%{transform:translateX(-50%) rotate(-2.5deg)} 50%{transform:translateX(-50%) rotate(2.5deg)} }

  /* ══ 2. pure — 100% PURE stamp ══ */
  .s-pure { background:radial-gradient(110% 90% at 80% 10%, #d69d80, var(--clay)); }
  .s-pure .pack { position:absolute; left:26%; top:56%; height:310px; transform:translate(-50%,-50%) rotate(-8deg);
    filter:drop-shadow(0 22px 24px rgba(90,40,20,.45)); animation:p-tilt var(--dur) ease-in-out infinite; }
  @keyframes p-tilt { 0%,100%{transform:translate(-50%,-50%) rotate(-9deg)} 50%{transform:translate(-50%,-52%) rotate(-4deg)} }
  .s-pure .badge { position:absolute; right:44px; top:34%; transform:rotate(9deg); text-align:center;
    color:var(--ivory); animation:p-pop var(--dur) ease-in-out infinite; }
  @keyframes p-pop { 0%,100%{scale:.94; rotate:8deg} 50%{scale:1.08; rotate:11deg} }
  .s-pure .badge .n { font-size:86px; line-height:.9; text-shadow:0 8px 20px rgba(90,40,20,.4); }
  .s-pure .badge .w { font-size:38px; letter-spacing:.14em; }
  .s-pure .spark { position:absolute; color:var(--ivory); font-size:34px; animation:p-spin var(--dur) linear infinite; }
  .s-pure .spark.a { right:36px; top:110px; }
  .s-pure .spark.b { right:196px; top:290px; font-size:22px; animation-direction:reverse; }
  @keyframes p-spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .s-pure .sub { position:absolute; left:50%; bottom:46px; transform:translateX(-50%); color:var(--ivory);
    font-size:40px; white-space:nowrap; }

  /* ══ 3. coconut — born from purity ══ */
  .s-coco { background:radial-gradient(100% 90% at 50% 0%, #fff, var(--sand)); }
  .s-coco .nut { position:absolute; left:50%; top:52%; width:190px; transform:translate(-50%,-50%);
    transform-origin:50% 100%; animation:c-bounce var(--dur) cubic-bezier(.36,0,.64,1) infinite;
    filter:drop-shadow(0 18px 16px rgba(20,19,15,.25)); }
  @keyframes c-bounce {
    0%,100% { transform:translate(-50%,-50%) scale(1,1); }
    30%     { transform:translate(-50%,-84%) scale(.96,1.05); }
    50%     { transform:translate(-50%,-50%) scale(1,1); }
    58%     { transform:translate(-50%,-44%) scale(1.09,.88); }
    66%     { transform:translate(-50%,-50%) scale(.98,1.03); }
  }
  .s-coco .shadow { position:absolute; left:50%; top:76%; width:180px; height:34px; transform:translateX(-50%);
    background:radial-gradient(ellipse, rgba(20,19,15,.28), transparent 68%);
    animation:c-shadow var(--dur) cubic-bezier(.36,0,.64,1) infinite; }
  @keyframes c-shadow { 0%,50%,100%{transform:translateX(-50%) scale(1)} 30%{transform:translateX(-50%) scale(.72); opacity:.6} 58%{transform:translateX(-50%) scale(1.12)} }
  .s-coco .drop { position:absolute; left:50%; top:58%; width:12px; height:16px; background:var(--green);
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%; opacity:0; }
  .s-coco .drop.a { animation:c-dropA var(--dur) ease-out infinite; }
  .s-coco .drop.b { animation:c-dropB var(--dur) ease-out infinite; }
  @keyframes c-dropA { 0%,55%{opacity:0; transform:translate(0,0) scale(.6)} 60%{opacity:1} 78%{opacity:1; transform:translate(-64px,-70px) scale(1)} 92%,100%{opacity:0; transform:translate(-80px,-30px)} }
  @keyframes c-dropB { 0%,55%{opacity:0; transform:translate(0,0) scale(.6)} 60%{opacity:1} 78%{opacity:1; transform:translate(58px,-78px) scale(1)} 92%,100%{opacity:0; transform:translate(74px,-34px)} }
  .s-coco .txt { position:absolute; left:50%; bottom:52px; transform:translateX(-50%); color:var(--deep);
    font-size:46px; white-space:nowrap; }

  /* ══ 4. morning — good morning sunshine ══ */
  .s-morning { background:linear-gradient(180deg, #f6d9b8 0%, #efc9a0 45%, var(--sand) 100%); }
  .s-morning .rays { position:absolute; left:50%; top:50%; width:700px; height:700px; transform:translate(-50%,-50%);
    background:repeating-conic-gradient(rgba(255,250,238,.55) 0deg 9deg, transparent 9deg 24deg);
    animation:m-rot var(--dur) linear infinite; }
  @keyframes m-rot { from{transform:translate(-50%,-50%) rotate(0)} to{transform:translate(-50%,-50%) rotate(48deg)} }
  .s-morning .sun { position:absolute; left:50%; top:50%; width:250px; height:250px; transform:translate(-50%,-50%);
    background:radial-gradient(circle, #ffe9c4, rgba(255,233,196,0) 70%); }
  .s-morning .pack { position:absolute; left:50%; top:52%; height:290px; transform:translate(-50%,-50%);
    filter:drop-shadow(0 20px 22px rgba(120,80,40,.35)); animation:m-float var(--dur) ease-in-out infinite; }
  @keyframes m-float { 0%,100%{transform:translate(-50%,-50%)} 50%{transform:translate(-50%,-53%)} }
  .s-morning .txt { position:absolute; left:50%; top:36px; transform:translateX(-50%); color:#8a5a34;
    font-size:48px; white-space:nowrap; }
  .s-morning .palm { position:absolute; width:170px; bottom:-30px; left:-38px; transform:rotate(-46deg);
    animation:m-sway var(--dur) ease-in-out infinite; }
  @keyframes m-sway { 0%,100%{rotate:0deg} 50%{rotate:4deg} }

  /* ══ 5. thirsty — thirsty? ══ */
  .s-thirsty { background:radial-gradient(120% 100% at 50% 100%, #1c5c36, var(--deep)); }
  .s-thirsty .txt { position:absolute; left:50%; top:64px; transform:translateX(-50%); color:var(--ivory);
    font-size:92px; white-space:nowrap; text-shadow:0 10px 26px rgba(0,0,0,.45);
    animation:t-wob var(--dur) ease-in-out infinite; }
  @keyframes t-wob { 0%,100%{transform:translateX(-50%) rotate(-3deg) scale(.98)} 50%{transform:translateX(-50%) rotate(3deg) scale(1.04)} }
  .s-thirsty .pack { position:absolute; left:50%; top:70%; height:250px;
    filter:drop-shadow(0 22px 24px rgba(0,0,0,.5)); animation:t-peek var(--dur) ease-in-out infinite; }
  @keyframes t-peek { 0%,100%{transform:translate(-50%,-46%) rotate(-7deg)} 50%{transform:translate(-50%,-54%) rotate(5deg)} }
  .s-thirsty .q { position:absolute; color:var(--green); font-size:44px; font-weight:800; font-family:'Zodiak',serif; }
  .s-thirsty .q.a { left:64px; top:220px; animation:t-q var(--dur) ease-in-out infinite; }
  .s-thirsty .q.b { right:64px; top:200px; animation:t-q var(--dur) ease-in-out infinite reverse; }
  @keyframes t-q { 0%,100%{transform:translateY(0) rotate(-10deg); opacity:.7} 50%{transform:translateY(-14px) rotate(8deg); opacity:1} }

  /* ══ 6. sparkle — naturally hydrating ══ */
  .s-sparkle { background:radial-gradient(110% 100% at 50% 10%, #16452a, var(--forest)); }
  .s-sparkle .pack { position:absolute; left:50%; top:50%; height:300px; transform:translate(-50%,-52%);
    filter:drop-shadow(0 24px 26px rgba(0,0,0,.55)); animation:sp-breathe var(--dur) ease-in-out infinite; }
  @keyframes sp-breathe { 0%,100%{transform:translate(-50%,-52%) scale(1)} 50%{transform:translate(-50%,-52%) scale(1.04)} }
  .s-sparkle .st { position:absolute; color:#b6f0a0; }
  .s-sparkle .st::after { content:'✦'; }
  .s-sparkle .st.a { left:96px;  top:120px; font-size:30px; animation:sp-tw var(--dur) ease-in-out infinite; }
  .s-sparkle .st.b { right:88px; top:150px; font-size:22px; animation:sp-tw var(--dur) ease-in-out infinite; animation-delay:calc(var(--dur) * -0.33); }
  .s-sparkle .st.c { left:120px; bottom:130px; font-size:24px; animation:sp-tw var(--dur) ease-in-out infinite; animation-delay:calc(var(--dur) * -0.66); }
  .s-sparkle .st.d { right:110px; bottom:170px; font-size:34px; animation:sp-tw var(--dur) ease-in-out infinite; animation-delay:calc(var(--dur) * -0.5); }
  @keyframes sp-tw { 0%,100%{opacity:.15; scale:.7; rotate:0deg} 50%{opacity:1; scale:1.15; rotate:40deg} }
  .s-sparkle .txt { position:absolute; left:50%; bottom:44px; transform:translateX(-50%); color:var(--ivory);
    font-size:44px; white-space:nowrap; text-shadow:0 6px 16px rgba(0,0,0,.4); }

  /* ══ 7. loading — refreshment loading ══ */
  .s-loading { background:var(--ivory); }
  .s-loading .txt { position:absolute; left:50%; top:120px; transform:translateX(-50%); color:var(--ink);
    font-size:34px; font-weight:800; font-family:'Zodiak',serif; white-space:nowrap; }
  .s-loading .script-sub { position:absolute; left:50%; top:64px; transform:translateX(-50%) rotate(-3deg);
    color:var(--green-dark); font-size:40px; white-space:nowrap; }
  .s-loading .bar { position:absolute; left:60px; right:60px; top:64%; height:26px; border-radius:999px;
    background:#e8e0cd; overflow:hidden; }
  .s-loading .fill { position:absolute; inset:0; border-radius:999px; transform-origin:0 50%;
    background:linear-gradient(90deg, var(--green), var(--green-dark)); animation:l-fill var(--dur) linear infinite; }
  @keyframes l-fill { 0%{transform:scaleX(.04)} 82%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
  .s-loading .pack { position:absolute; top:64%; left:60px; height:118px; transform:translate(-50%,-108%);
    filter:drop-shadow(0 14px 16px rgba(20,19,15,.3)); animation:l-ride var(--dur) linear infinite; }
  @keyframes l-ride {
    0%   { left:76px;  transform:translate(-50%,-106%) rotate(-3deg); }
    41%  { transform:translate(-50%,-106%) rotate(3deg); }
    82%  { left:404px; transform:translate(-50%,-106%) rotate(-3deg); }
    100% { left:404px; transform:translate(-50%,-112%) rotate(0deg); }
  }
  .s-loading .pct { position:absolute; left:50%; bottom:98px; transform:translateX(-50%); color:var(--green-dark);
    font-weight:800; font-size:26px; letter-spacing:.06em; animation:l-blink var(--dur) linear infinite; }
  @keyframes l-blink { 0%,80%{opacity:.55} 84%,92%{opacity:1} 96%,100%{opacity:.55} }

  /* ══ Stickers (transparant) — witte outline, geen zachte schaduwen ══ */
  .st-outline { filter:
    drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff)
    drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff); }
  .st-text { -webkit-text-stroke:10px #fff; paint-order:stroke fill; }
  /* ÉLAN-logo in elke sticker: zwart met witte outline, onderin gecentreerd */
  .st-brand { position:absolute; left:50%; transform:translateX(-50%); height:44px; }

  .s-stpack .pack { position:absolute; left:50%; top:50%; height:400px;
    animation:stp-bob var(--dur) ease-in-out infinite; }
  @keyframes stp-bob { 0%,100%{transform:translate(-50%,-50%) rotate(-4deg)} 50%{transform:translate(-50%,-54%) rotate(4deg)} }

  .s-sthydr .txt { position:absolute; left:50%; top:34%; transform:translate(-50%,-50%); color:var(--green-dark);
    font-size:80px; white-space:nowrap; animation:sth-wob var(--dur) ease-in-out infinite; }
  @keyframes sth-wob { 0%,100%{transform:translate(-50%,-50%) rotate(-3deg) scale(.97)} 50%{transform:translate(-50%,-50%) rotate(3deg) scale(1.03)} }
  .s-sthydr .drop { position:absolute; left:50%; top:52%; width:34px; height:44px; background:var(--green);
    border:4px solid #fff; border-radius:50% 50% 50% 50%/62% 62% 40% 40%;
    animation:sth-drop var(--dur) cubic-bezier(.36,0,.64,1) infinite; }
  @keyframes sth-drop { 0%,100%{transform:translate(-50%,0) scale(1,1)} 30%{transform:translate(-50%,-46px) scale(.94,1.06)} 55%{transform:translate(-50%,0) scale(1.08,.9)} 70%{transform:translate(-50%,-10px) scale(1,1)} }
  .s-sthydr .st-brand { bottom:70px; }

  .s-stcoco .nut { position:absolute; left:50%; top:52%; width:250px; transform:translate(-50%,-50%);
    animation:c-bounce var(--dur) cubic-bezier(.36,0,.64,1) infinite; }
  .s-stcoco .drop { position:absolute; left:50%; top:58%; width:16px; height:21px; background:var(--green);
    border:3px solid #fff; border-radius:50% 50% 50% 50%/60% 60% 40% 40%; opacity:0; }
  .s-stcoco .drop.a { animation:c-dropA var(--dur) ease-out infinite; }
  .s-stcoco .drop.b { animation:c-dropB var(--dur) ease-out infinite; }
  .s-stcoco .nut { top:44%; }
  .s-stcoco .st-brand { bottom:52px; }

  .s-stpure .badge { position:absolute; left:50%; top:44%; width:300px; height:300px; margin:-150px 0 0 -150px;
    border-radius:50%; background:var(--green); border:10px solid #fff;
    display:grid; place-content:center; text-align:center; color:var(--ivory);
    animation:stp-pulse var(--dur) ease-in-out infinite; }
  @keyframes stp-pulse { 0%,100%{transform:rotate(-6deg) scale(.96)} 50%{transform:rotate(6deg) scale(1.04)} }
  .s-stpure .n { font-size:88px; line-height:.95; }
  .s-stpure .w { font-size:48px; letter-spacing:.12em; }
  .s-stpure .s { font-size:26px; margin-top:6px; color:#eaffdf; }
  .s-stpure .st-brand { bottom:36px; }

  .s-stthirsty .txt { position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); color:var(--green);
    font-size:104px; white-space:nowrap; animation:stt-wob var(--dur) ease-in-out infinite; }
  @keyframes stt-wob { 0%,100%{transform:translate(-50%,-50%) rotate(-4deg) scale(.96)} 50%{transform:translate(-50%,-48%) rotate(4deg) scale(1.05)} }
  .s-stthirsty .st-brand { bottom:80px; }

  /* ══ 9. splash — pak met opspattende druppels (transparant) ══ */
  .s-splash .pack { position:absolute; left:50%; top:48%; height:340px; transform:translate(-50%,-50%);
    animation:sp2-shake var(--dur) ease-in-out infinite; }
  @keyframes sp2-shake { 0%,100%{transform:translate(-50%,-50%) rotate(-3deg)} 25%{transform:translate(-51%,-50%) rotate(3deg)} 60%{transform:translate(-49%,-51%) rotate(-2deg)} }
  .s-splash .d { position:absolute; left:50%; top:50%; width:26px; height:32px; background:#9fe0ff;
    border:4px solid #fff; border-radius:50% 50% 50% 50%/62% 62% 40% 40%; opacity:0; }
  .s-splash .d1 { animation:spl1 var(--dur) ease-out infinite; }
  .s-splash .d2 { animation:spl2 var(--dur) ease-out infinite; }
  .s-splash .d3 { animation:spl3 var(--dur) ease-out infinite; width:18px; height:22px; }
  .s-splash .d4 { animation:spl4 var(--dur) ease-out infinite; width:18px; height:22px; }
  @keyframes spl1 { 0%,40%{opacity:0; transform:translate(-10px,-10px) scale(.4)} 50%{opacity:1} 78%{opacity:1; transform:translate(-150px,-120px) scale(1)} 100%{opacity:0; transform:translate(-180px,-30px)} }
  @keyframes spl2 { 0%,40%{opacity:0; transform:translate(-10px,-10px) scale(.4)} 50%{opacity:1} 78%{opacity:1; transform:translate(140px,-130px) scale(1)} 100%{opacity:0; transform:translate(170px,-40px)} }
  @keyframes spl3 { 0%,45%{opacity:0; transform:translate(-10px,-10px) scale(.4)} 55%{opacity:1} 80%{opacity:1; transform:translate(-180px,20px) scale(1)} 100%{opacity:0; transform:translate(-200px,90px)} }
  @keyframes spl4 { 0%,45%{opacity:0; transform:translate(-10px,-10px) scale(.4)} 55%{opacity:1} 80%{opacity:1; transform:translate(170px,10px) scale(1)} 100%{opacity:0; transform:translate(200px,80px)} }
  .s-splash .st-brand { bottom:30px; }

  /* ══ 10. sunny — zon met pak (transparant) ══ */
  .s-sunny .sun { position:absolute; left:50%; top:46%; width:230px; height:230px; margin:-115px 0 0 -115px;
    border-radius:50%; background:#ffd23f; border:8px solid #fff;
    animation:sun-pulse var(--dur) ease-in-out infinite; }
  @keyframes sun-pulse { 0%,100%{transform:scale(.97)} 50%{transform:scale(1.05)} }
  .s-sunny .ray { position:absolute; left:50%; top:46%; width:8px; height:44px; margin-left:-4px; border-radius:4px;
    background:#ffd23f; box-shadow:0 0 0 3px #fff; transform-origin:4px 158px; }
  .s-sunny .rays { position:absolute; inset:0; animation:sun-rot var(--dur) linear infinite; }
  @keyframes sun-rot { from{transform:rotate(0)} to{transform:rotate(45deg)} }
  .s-sunny .pack { position:absolute; left:50%; top:47%; height:220px; transform:translate(-50%,-50%);
    animation:sun-bob var(--dur) ease-in-out infinite; }
  @keyframes sun-bob { 0%,100%{transform:translate(-50%,-50%) rotate(-3deg)} 50%{transform:translate(-50%,-54%) rotate(3deg)} }
  .s-sunny .txt { position:absolute; left:50%; bottom:44px; transform:translateX(-50%); color:#f5a623;
    font-size:44px; white-space:nowrap; }

  /* ══ 11. cheers — twee pakken proosten (transparant) ══ */
  .s-cheers .pack { position:absolute; top:50%; height:280px; }
  .s-cheers .l { left:50%; transform-origin:60% 90%; animation:ch-l var(--dur) ease-in-out infinite; }
  .s-cheers .r { left:50%; transform-origin:40% 90%; animation:ch-r var(--dur) ease-in-out infinite; }
  @keyframes ch-l { 0%,100%{transform:translate(-96%,-50%) rotate(-14deg)} 45%,55%{transform:translate(-92%,-50%) rotate(-24deg)} }
  @keyframes ch-r { 0%,100%{transform:translate(-4%,-50%) rotate(14deg)} 45%,55%{transform:translate(-8%,-50%) rotate(24deg)} }
  .s-cheers .spark { position:absolute; left:50%; top:34%; transform:translateX(-50%); color:#ffd23f; font-size:40px;
    opacity:0; animation:ch-spark var(--dur) ease-in-out infinite; }
  @keyframes ch-spark { 0%,44%{opacity:0; scale:.4} 50%{opacity:1; scale:1.2} 58%{opacity:0; scale:1.5} 100%{opacity:0} }
  .s-cheers .txt { position:absolute; left:50%; bottom:40px; transform:translateX(-50%); color:var(--green-dark);
    font-size:50px; white-space:nowrap; }
  .s-cheers .st-brand { display:none; }

  /* ══ 12. fresh — tekst met wiegende palm (transparant) ══ */
  .s-fresh .txt { position:absolute; left:50%; top:42%; transform:translate(-50%,-50%) rotate(-4deg); color:var(--green);
    font-size:76px; white-space:nowrap; text-align:center; line-height:.9;
    animation:fr-b var(--dur) ease-in-out infinite; }
  @keyframes fr-b { 0%,100%{transform:translate(-50%,-50%) rotate(-5deg) scale(.98)} 50%{transform:translate(-50%,-50%) rotate(-1deg) scale(1.02)} }
  .s-fresh .palm { position:absolute; width:150px; top:20px; right:16px; transform:rotate(150deg);
    animation:fr-sway var(--dur) ease-in-out infinite; }
  .s-fresh .palm2 { position:absolute; width:130px; bottom:70px; left:10px; transform:rotate(-30deg);
    animation:fr-sway var(--dur) ease-in-out infinite reverse; }
  @keyframes fr-sway { 0%,100%{rotate:0deg} 50%{rotate:6deg} }
  .s-fresh .st-brand { bottom:28px; }

  /* ══ 13. lockup — officiële 100% PURE COCONUT WATER (transparant) ══ */
  .s-lockup .lock { position:absolute; left:50%; top:42%; width:400px; transform:translate(-50%,-50%);
    animation:lk-pop var(--dur) ease-in-out infinite; }
  @keyframes lk-pop { 0%,100%{transform:translate(-50%,-50%) scale(.96) rotate(-1.5deg)} 50%{transform:translate(-50%,-50%) scale(1.04) rotate(1.5deg)} }
  .s-lockup .nut { position:absolute; width:130px; left:24px; bottom:52px; transform:rotate(-8deg);
    animation:lk-bob var(--dur) ease-in-out infinite; }
  .s-lockup .palm { position:absolute; width:150px; right:6px; top:8px; transform:rotate(150deg);
    animation:lk-sway var(--dur) ease-in-out infinite; }
  @keyframes lk-bob { 0%,100%{translate:0 0} 50%{translate:0 -8px} }
  @keyframes lk-sway { 0%,100%{rotate:0deg} 50%{rotate:6deg} }
  .s-lockup .st-brand { bottom:26px; height:38px; }

  /* Gedeelde quote-sticker helpers */
  .s-quote .txt { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); text-align:center;
    color:var(--green); font-size:74px; line-height:.86; white-space:nowrap;
    animation:q-wob var(--dur) ease-in-out infinite; }
  @keyframes q-wob { 0%,100%{transform:translate(-50%,-50%) rotate(-4deg) scale(.97)} 50%{transform:translate(-50%,-50%) rotate(3deg) scale(1.04)} }
  .s-quote .nut { position:absolute; width:120px; }
  .s-quote .palm { position:absolute; width:140px; }
  .s-quote .st-brand { bottom:28px; }
  .s-quote .emoji { position:absolute; font-size:52px; }

  /* sip sip hooray — bruisende bubbels */
  .s-sip .nut { left:50%; top:70%; transform:translate(-50%,-50%) rotate(-6deg);
    animation:c-bounce var(--dur) cubic-bezier(.36,0,.64,1) infinite; }
  .s-sip .txt { top:32%; }
  .s-sip .bub { position:absolute; left:50%; bottom:120px; width:16px; height:16px; border-radius:50%;
    background:rgba(120,220,160,.9); border:3px solid #fff; opacity:0; }
  .s-sip .b1 { animation:bub var(--dur) ease-in infinite; }
  .s-sip .b2 { animation:bub var(--dur) ease-in infinite; animation-delay:calc(var(--dur)*-.3); margin-left:-40px; }
  .s-sip .b3 { animation:bub var(--dur) ease-in infinite; animation-delay:calc(var(--dur)*-.6); margin-left:36px; width:11px; height:11px; }
  @keyframes bub { 0%{opacity:0; transform:translateY(0) scale(.5)} 20%{opacity:1} 80%{opacity:1} 100%{opacity:0; transform:translateY(-150px) scale(1)} }

  /* taste the tropics — twee wiegende palmen */
  .s-trop .palm.a { top:6px; left:-30px; transform:rotate(-150deg) scaleX(-1); animation:lk-sway var(--dur) ease-in-out infinite; }
  .s-trop .palm.b { bottom:66px; right:-24px; transform:rotate(24deg); animation:lk-sway var(--dur) ease-in-out infinite reverse; }
  .s-trop .txt { font-size:66px; }

  /* coco loco — tollende kokosnoot */
  .s-loco .txt { top:36%; font-size:92px; }
  .s-loco .nut { left:50%; top:70%; width:150px; transform:translate(-50%,-50%);
    animation:loco-spin var(--dur) ease-in-out infinite; }
  @keyframes loco-spin { 0%,100%{transform:translate(-50%,-50%) rotate(-16deg)} 50%{transform:translate(-50%,-50%) rotate(16deg)} }

  /* beach please — palm + zon */
  .s-beach .txt { font-size:70px; }
  .s-beach .sun { position:absolute; right:40px; top:44px; width:90px; height:90px; border-radius:50%;
    background:#ffd23f; border:6px solid #fff; animation:sun-pulse var(--dur) ease-in-out infinite; }
  .s-beach .palm { bottom:60px; left:-20px; transform:rotate(-40deg); animation:lk-sway var(--dur) ease-in-out infinite; }

  /* ══ 8. sea — vitamin sea ══ (dupe marker verwijderd) ══ */

  /* ══ 8. sea — vitamin sea ══ */
  .s-sea { background:linear-gradient(180deg, #bfe4d9 0%, #79c4b0 46%, #3f9e8c 100%); }
  .s-sea .wave { position:absolute; left:-40%; width:180%; height:150px; border-radius:46% 54% 0 0/100% 100% 0 0; }
  .s-sea .wave.w1 { bottom:-56px; background:rgba(24,120,102,.65); animation:w-drift var(--dur) ease-in-out infinite; }
  .s-sea .wave.w2 { bottom:-78px; background:rgba(16,95,82,.8);  animation:w-drift var(--dur) ease-in-out infinite reverse; }
  @keyframes w-drift { 0%,100%{transform:translateX(-20px)} 50%{transform:translateX(20px)} }
  .s-sea .pack { position:absolute; left:50%; top:47%; height:270px; transform-origin:50% 90%;
    filter:drop-shadow(0 20px 20px rgba(10,60,50,.4)); animation:sea-buoy var(--dur) ease-in-out infinite; }
  @keyframes sea-buoy { 0%,100%{transform:translate(-50%,-50%) rotate(-5deg)} 50%{transform:translate(-50%,-46%) rotate(5deg)} }
  .s-sea .txt { position:absolute; left:50%; top:44px; transform:translateX(-50%) rotate(-3deg); color:#0d4a3e;
    font-size:56px; white-space:nowrap; }
  .s-sea .gull { position:absolute; color:#0d4a3e; font-size:22px; opacity:.7; }
  .s-sea .gull.a { left:80px; top:130px; animation:g-fly var(--dur) ease-in-out infinite; }
  .s-sea .gull.b { right:90px; top:104px; animation:g-fly var(--dur) ease-in-out infinite reverse; }
  @keyframes g-fly { 0%,100%{transform:translate(0,0)} 50%{transform:translate(14px,-8px)} }
</style>
</head>
<body>
<div id="stage" class="stage"></div>
<script>
const PACK = '/elan-bottle.png'
const PALM = '/palm-leaf.png'
const NUT = '/coconut.png'
const LOCKUP = '/pure-lockup.png'
const LOGO_L = '/elan-logo-light.svg'
const LOGO_D = '/elan-logo-black.svg'

const SCENES = {
  float: { dur: 3200, html: `
    <div class="glow"></div>
    <img class="palm a" src="${PALM}"><img class="palm b" src="${PALM}">
    <img class="pack" src="${PACK}">
    <div class="txt script">stay hydrated</div>
    <img class="logo" src="${LOGO_L}">` },
  pure: { dur: 2400, html: `
    <img class="pack" src="${PACK}">
    <div class="badge"><div class="n serif">100%</div><div class="w serif">PURE</div></div>
    <div class="spark a">✦</div><div class="spark b">✦</div>
    <div class="sub script">nothing else</div>
    <img class="logo" src="${LOGO_L}">` },
  coconut: { dur: 1900, html: `
    <div class="shadow"></div>
    <img class="nut" src="${NUT}">
    <div class="drop a"></div><div class="drop b"></div>
    <div class="txt script">born from purity</div>
    <img class="logo" src="${LOGO_D}" style="filter:none">` },
  morning: { dur: 3600, html: `
    <div class="rays"></div><div class="sun"></div>
    <img class="palm" src="${PALM}">
    <img class="pack" src="${PACK}">
    <div class="txt script">good morning sunshine</div>
    <img class="logo" src="${LOGO_D}">` },
  thirsty: { dur: 2200, html: `
    <div class="txt script">thirsty?</div>
    <div class="q a">?</div><div class="q b">?</div>
    <img class="pack" src="${PACK}">
    <img class="logo" src="${LOGO_L}">` },
  sparkle: { dur: 2600, html: `
    <span class="st a"></span><span class="st b"></span><span class="st c"></span><span class="st d"></span>
    <img class="pack" src="${PACK}">
    <div class="txt script">naturally hydrating</div>
    <img class="logo" src="${LOGO_L}">` },
  loading: { dur: 3000, html: `
    <div class="script-sub script">almost weekend…</div>
    <div class="txt">REFRESHMENT LOADING</div>
    <div class="bar"><div class="fill"></div></div>
    <img class="pack" src="${PACK}">
    <div class="pct">100%</div>
    <img class="logo" src="${LOGO_D}">` },
  sea: { dur: 3200, html: `
    <div class="txt script">vitamin sea</div>
    <img class="pack" src="${PACK}">
    <div class="wave w1"></div><div class="wave w2"></div>
    <img class="logo" src="${LOGO_L}">` },

  /* Stickers — transparante achtergrond, witte outline */
  'sticker-pack': { dur: 3000, transparent: true, html: `
    <img class="pack st-outline" src="${PACK}">` },
  'sticker-hydrated': { dur: 2600, transparent: true, html: `
    <div class="txt script st-text">stay hydrated</div>
    <div class="drop"></div>
    <img class="st-brand st-outline" src="${LOGO_D}">` },
  'sticker-coconut': { dur: 1900, transparent: true, html: `
    <img class="nut st-outline" src="${NUT}">
    <div class="drop a"></div><div class="drop b"></div>
    <img class="st-brand st-outline" src="${LOGO_D}">` },
  'sticker-pure': { dur: 2600, transparent: true, html: `
    <div class="badge"><div class="n serif">100%</div><div class="w serif">PURE</div><div class="s script">coconut water</div></div>
    <img class="st-brand st-outline" src="${LOGO_D}">` },
  // Officiële 100% PURE COCONUT WATER lockup
  'sticker-lockup': { dur: 2800, transparent: true, html: `
    <img class="palm st-outline" src="${PALM}">
    <img class="nut st-outline" src="${NUT}">
    <img class="lock st-outline" src="${LOCKUP}">
    <img class="st-brand st-outline" src="${LOGO_D}">` },
  'sticker-sip': { dur: 2600, transparent: true, cls: 'quote', html: `
    <div class="txt script st-text">sip sip<br>hooray!</div>
    <div class="bub b1"></div><div class="bub b2"></div><div class="bub b3"></div>
    <img class="nut st-outline" src="${NUT}">
    <img class="st-brand st-outline" src="${LOGO_D}">` },
  'sticker-tropics': { dur: 2800, transparent: true, cls: 'quote', html: `
    <img class="palm a st-outline" src="${PALM}"><img class="palm b st-outline" src="${PALM}">
    <div class="txt script st-text">taste the<br>tropics</div>
    <img class="st-brand st-outline" src="${LOGO_D}">` },
  'sticker-loco': { dur: 2400, transparent: true, cls: 'quote', html: `
    <div class="txt script st-text">coco loco</div>
    <img class="nut st-outline" src="${NUT}">
    <img class="st-brand st-outline" src="${LOGO_D}">` },
  'sticker-beach': { dur: 2800, transparent: true, cls: 'quote', html: `
    <div class="sun"></div>
    <img class="palm st-outline" src="${PALM}">
    <div class="txt script st-text">beach please</div>
    <img class="st-brand st-outline" src="${LOGO_D}">` },
  'sticker-thirsty': { dur: 2200, transparent: true, html: `
    <div class="txt script st-text">thirsty?</div>
    <img class="st-brand st-outline" src="${LOGO_D}">` },
  'sticker-splash': { dur: 2400, transparent: true, html: `
    <div class="d d3"></div><div class="d d4"></div>
    <div class="d d1"></div><div class="d d2"></div>
    <img class="pack st-outline" src="${PACK}">
    <img class="st-brand st-outline" src="${LOGO_D}">` },
  'sticker-sunny': { dur: 3200, transparent: true, html: `
    <div class="rays">${Array.from({length:12}).map((_,i)=>`<div class="ray" style="transform:rotate(${i*30}deg)"></div>`).join('')}</div>
    <div class="sun"></div>
    <img class="pack st-outline" src="${PACK}">
    <div class="txt script st-text">soak up the sun</div>` },
  'sticker-cheers': { dur: 2600, transparent: true, html: `
    <div class="spark">✦</div>
    <img class="pack st-outline l" src="${PACK}">
    <img class="pack st-outline r" src="${PACK}">
    <div class="txt script st-text">cheers!</div>` },
  'sticker-fresh': { dur: 2800, transparent: true, html: `
    <img class="palm st-outline" src="${PALM}"><img class="palm2 st-outline" src="${PALM}">
    <div class="txt script st-text">stay fresh<br>stay tropical</div>
    <img class="st-brand st-outline" src="${LOGO_D}">` },
}

const name = new URLSearchParams(location.search).get('scene') || 'float'
const scene = SCENES[name]
const stage = document.getElementById('stage')
const cls = {
  float:'float', pure:'pure', coconut:'coco', morning:'morning', thirsty:'thirsty',
  sparkle:'sparkle', loading:'loading', sea:'sea',
  'sticker-pack':'stpack', 'sticker-hydrated':'sthydr', 'sticker-coconut':'stcoco',
  'sticker-pure':'stpure', 'sticker-thirsty':'stthirsty',
  'sticker-splash':'splash', 'sticker-sunny':'sunny', 'sticker-cheers':'cheers', 'sticker-fresh':'fresh',
  'sticker-lockup':'lockup',
  'sticker-sip':'quote sip', 'sticker-tropics':'quote trop',
  'sticker-loco':'quote loco', 'sticker-beach':'quote beach',
}[name]
stage.className = 'stage ' + cls.split(' ').map((c) => 's-' + c).join(' ')
stage.style.setProperty('--dur', scene.dur + 'ms')
stage.innerHTML = scene.html
if (scene.transparent) { document.body.style.background = 'none'; stage.style.background = 'none' }
window.SCENE_DUR = scene.dur
window.SCENE_TRANSPARENT = !!scene.transparent
window.SCENE_LIST = Object.keys(SCENES)

// Alle animaties pauzeren en exact op tijdstip t (ms) zetten — voor frame-capture.
window.seek = (t) => {
  document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t })
}
</script>
</body>
</html>
